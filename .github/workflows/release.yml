name: Build and publish Windows preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build app with bundled engine
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify window capture filter and regression tests
        shell: pwsh
        run: |
          $help = & ./dist/PolarRec/tools/ffmpeg.exe -hide_banner -h filter=gfxcapture 2>&1 | Out-String
          if ($help -notmatch 'hwnd' -or $help -notmatch 'resize_mode') { throw 'Window capture filter unavailable' }
          dotnet run --project tests/CaptureArgumentsHarness -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Capture argument checks failed' }
      - name: Test native window isolation
        shell: pwsh
        run: |
          dotnet run --project tests/WindowCaptureSmoke -c Release -- ./dist/PolarRec/tools/ffmpeg.exe
          if ($LASTEXITCODE -eq 77) {
            '::notice::Native capture test skipped: runner cannot create a D3D11 device. This is not a passing capture test.' | Write-Host
            'Native window isolation: NOT VERIFIED (no D3D11 device on runner).' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native window capture isolation check failed' }
          'Native window isolation: PASS.' >> $env:GITHUB_STEP_SUMMARY
      - name: Prepare installer payload
        shell: pwsh
        run: |
          Copy-Item dist/PolarRec app-polarrec -Recurse
          $payload = (Resolve-Path app-polarrec).Path
          $lines = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem $payload -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($payload, $_.FullName)
            $lines.Add('Delete "$INSTDIR\' + $relative + '"')
          }
          Get-ChildItem $payload -Directory -Recurse | Sort-Object { $_.FullName.Length } -Descending | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($payload, $_.FullName)
            $lines.Add('RMDir "$INSTDIR\' + $relative + '"')
          }
          $lines | Set-Content installer/uninstall-files.nsh -Encoding utf8
          if (!(Test-Path 'app-polarrec/PolarRec.exe') -or !(Test-Path 'app-polarrec/tools/ffmpeg.exe')) { throw 'Missing payload' }
      - name: Compile installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          Push-Location installer
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 PolarRecorder.nsi
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Move-Item ../PolarRec-0.4.0-Setup.exe ./PolarRec-0.4.0-Setup.exe
          $hash = (Get-FileHash PolarRec-0.4.0-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PolarRec-0.4.0-Setup.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PolarRec-0.4.0-Windows
          path: |
            PolarRec-0.4.0-Setup.exe
            SHA256SUMS.txt
      - name: Publish preview release once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; retained unchanged.'; exit 0 }
          gh release create v0.4.0 PolarRec-0.4.0-Setup.exe SHA256SUMS.txt --target $env:GITHUB_SHA --title 'PolarRec 0.4.0 · 폴라렉' --notes-file docs/RELEASE-0.4.0.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
