name: Build and publish Windows preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build app with bundled engine
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Prepare installer payload
        shell: pwsh
        run: |
          Copy-Item dist/PolarRec app-polarrec -Recurse
          $payload = (Resolve-Path app-polarrec).Path
          $lines = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem $payload -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($payload, $_.FullName)
            $lines.Add('Delete "$INSTDIR\' + $relative + '"')
          }
          Get-ChildItem $payload -Directory -Recurse | Sort-Object { $_.FullName.Length } -Descending | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($payload, $_.FullName)
            $lines.Add('RMDir "$INSTDIR\' + $relative + '"')
          }
          $lines | Set-Content installer/uninstall-files.nsh -Encoding utf8
          if (!(Test-Path 'app-polarrec/PolarRec.exe') -or !(Test-Path 'app-polarrec/tools/ffmpeg.exe')) { throw 'Missing payload' }
      - name: Compile installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer/PolarRecorder.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Move-Item ../PolarRec-0.3.3-Setup.exe ./PolarRec-0.3.3-Setup.exe
          $hash = (Get-FileHash PolarRec-0.3.3-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PolarRec-0.3.3-Setup.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: PolarRec-0.3.3-Windows
          path: |
            PolarRec-0.3.3-Setup.exe
            SHA256SUMS.txt
      - name: Publish preview release once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.3 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; retained unchanged.'; exit 0 }
          gh release create v0.3.3 PolarRec-0.3.3-Setup.exe SHA256SUMS.txt --target $env:GITHUB_SHA --title 'PolarRec 0.3.3 · 폴라렉' --notes-file docs/RELEASE-0.3.3.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
